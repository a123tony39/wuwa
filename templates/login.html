<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>鳴潮工具箱 - 登入</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-deep:     #060912;
    --bg-mid:      #0a0f1c;
    --bg-card:     #0d1424;
    --border:      rgba(99,179,255,0.12);
    --border-glow: rgba(99,179,255,0.35);
    --accent:      #63b3ff;
    --accent2:     #a78bfa;
    --text:        #e2eaf7;
    --text-muted:  #5a7090;
    --text-dim:    #2e4060;
    --gold:        #e8c87a;
    --danger:      #f87171;
    --danger-dim:  rgba(248,113,113,0.1);
}

*, *::before, *::after {
    margin: 0; padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    overflow: hidden;
    position: relative;
}

/* ─── 背景特效（延續主頁） ─── */
body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 50% at 50% 40%, rgba(99,179,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 80% 20%, rgba(167,139,250,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

body::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: .6;
}

/* ─── 登入卡片外框 ─── */
.login-container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    position: relative;
    z-index: 1;
}

.login-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    animation: fadeUp 0.5s ease both;
}

.login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,179,255,0.4), transparent);
}

.login-card:hover {
    border-color: var(--border-glow);
    box-shadow: 0 0 40px rgba(99,179,255,0.06);
}

/* ─── Logo 樣式 ─── */
.logo-wrap {
    text-align: center;
    margin-bottom: 36px;
}

.logo-sub {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.logo {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
}

.logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ─── 表單輸入框 ─── */
.form-group {
    margin-bottom: 22px;
    position: relative;
}

.form-label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
}

.form-input {
    width: 100%;
    padding: 13px 16px;
    background: rgba(6, 9, 18, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
}

.form-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(99,179,255,0.15);
    background: rgba(6, 9, 18, 0.8);
}

.form-input::placeholder {
    color: var(--text-dim);
}

/* ─── 錯誤訊息提示 ─── */
.error-alert {
    background: var(--danger-dim);
    border: 1px solid rgba(248, 113, 113, 0.2);
    color: var(--danger);
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* ─── 按鈕 ─── */
.btn-submit {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(99,179,255,0.35);
    background: linear-gradient(135deg, rgba(99,179,255,0.15), rgba(167,139,250,0.1));
    color: var(--accent);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.1em;
    transition: all 0.2s ease;
    margin-top: 10px;
}

.btn-submit:hover {
    background: linear-gradient(135deg, rgba(99,179,255,0.25), rgba(167,139,250,0.18));
    box-shadow: 0 0 20px rgba(99,179,255,0.15);
    border-color: var(--accent);
}

.card-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        
        <div class="logo-wrap">
            <div class="logo-sub">Wuthering Waves</div>
            <div class="logo"><span>鳴潮</span> 工具箱</div>
        </div>

        <!-- Django 錯誤訊息顯示區塊 -->
        {% if form.errors or messages %}
        <div class="error-alert">
            <span>⚠</span>
            <span>
                {% if form.errors %}
                    帳號或密碼輸入錯誤，請再試一次。
                {% else %}
                    {% for message in messages %}{{ message }}{% endfor %}
                {% endif %}
            </span>
        </div>
        {% endif %}

        <!-- 登入表單：將 action 改為直接指向登入路徑，確保安全引導 -->
        <form method="POST" action="/login/">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="username">管理員帳號</label>
                <input type="text" name="username" id="username" class="form-input" placeholder="請輸入帳號" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密碼</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="請輸入密碼" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-submit">驗證連線</button>
        </form>

        <div class="card-footer">
            v1.0 &nbsp;·&nbsp; 鳴潮工具內部系統
        </div>
    </div>
</div>

</body>
</html>
