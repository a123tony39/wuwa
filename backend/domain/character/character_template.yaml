# === 角色屬性模板 ===
#
# en
#   英文名
#
# main_attr
#   角色推薦主詞條
#   可選值:
#     - 生命
#     - 攻擊
#     - 防禦
#
# dmg_type
#   角色主要輸出方式
#   可選值:
#     - 普攻
#     - 重擊
#     - 共鳴技能
#     - 共鳴解放
#
# role
#   角色定位
#   可選值:
#     - 輸出
#     - 輔助
#     - 弗洛洛 (特殊)
#
# element
#   元素傷害
#   可選值:
#     - 湮滅
#     - 氣動
#     - 衍射
#     - 熱熔
#     - 冷凝
#     - 導電

